{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    {% include 'dashboard/sidebar.html' %}

    <div class="col-md-9">
        {% if perms.auth.change_user %}
        <h2>Add New Users</h2>
        
        <form action="{%url 'edit_users' user.pk%}" method="POST">
            {% csrf_token%}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        <br>
        {%else%}
        <h5>You have no permission to view this page</h5>
        {% endif %}

    </div>
</div>
{% endblock %}
